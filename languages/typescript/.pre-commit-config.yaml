repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: pnpm exec biome check --write
        language: system
        files: \.(ts|tsx|js|jsx)$
        require_serial: true

      - id: tsc
        name: tsc type check
        entry: pnpm exec tsc --noEmit
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: false
        require_serial: true

      - id: commit-msg-lint
        name: commit message lint
        entry: bash scripts/hooks/commit-msg-lint.sh
        language: system
        stages: [commit-msg]
