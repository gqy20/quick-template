repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --all-extras mypy src/{{ package_name }}
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: commit-msg-lint
        name: commit message lint
        entry: bash scripts/hooks/commit-msg-lint.sh
        language: system
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: commit-msg-lint
        name: commit message lint
        entry: bash scripts/hooks/commit-msg-lint.sh
        language: system
        stages: [commit-msg]
