repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # uv.lock 是应提交的文件；装了可选 Agent 依赖后可达 600 KB 以上，
      # 默认 500 KB 阈值会误拦。
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # 用项目自己的虚拟环境并装上可选 extra：独立 hook 环境的 Python
        # 版本和依赖集合与项目不一致，会让 `# type: ignore` 判定失准。
        # 首次运行需要解析 extra 依赖，之后复用缓存。
        entry: uv run --all-extras mypy src/{{ package_name }}
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: commit-msg-lint
        name: commit message lint
        entry: bash scripts/hooks/commit-msg-lint.sh
        language: system
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: commit-msg-lint
        name: commit message lint
        entry: bash scripts/hooks/commit-msg-lint.sh
        language: system
        stages: [commit-msg]
