version: 2
updates:
{{#if language == 'python'}}  # Python 依赖
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
{{#elif language == 'golang'}}  # Go 依赖
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
{{#elif language == 'typescript'}}  # npm 依赖
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
{{#endif}}

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
