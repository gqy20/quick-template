{{#if language != 'golang'}}
name: Publish
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
{{#if language == 'python'}}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "{{ python_version }}"
{{#else}}
      - uses: actions/setup-node@v7
        with:
          node-version: "{{ node_version }}"
      - uses: pnpm/action-setup@v6
{{#endif}}
      - run: make install && make all
      - name: 校验版本并构建
        run: |
{{#if language == 'python'}}
          version=$(uv run python -c 'from importlib.metadata import version; print(version("{{project_slug}}"))')
          test "$GITHUB_REF_NAME" = "v$version"
          make build
          uvx twine check dist/*
{{#else}}
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          make build
          mkdir "$RUNNER_TEMP/packages"
          pnpm pack --pack-destination "$RUNNER_TEMP/packages"
{{#endif}}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: {{#if language == 'python'}}dist/*{{#else}}${{ runner.temp }}/packages/*.tgz{{#endif}}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: {{#if language == 'python'}}pypi{{#else}}npm{{#endif}}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/
{{#if language == 'python'}}
      - uses: pypa/gh-action-pypi-publish@release/v1
{{#else}}
      - uses: actions/setup-node@v7
        with:
          node-version: "{{ node_version }}"
          registry-url: https://registry.npmjs.org/
      - run: npm publish dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
{{#endif}}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/
      - name: 安装说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo '{{#if language == 'python'}}pip install {{project_slug}}=={{#else}}npm install {{package_name}}@{{#endif}}'"$version" > release-notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-notes.txt
          files: dist/*
{{#endif}}
