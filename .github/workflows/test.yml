name: 测试模板生成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: Wheel 安装冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: 构建并安装 wheel
        run: |
          uv build
          SMOKE_ENV="$RUNNER_TEMP/quick-template-smoke"
          uv venv "$SMOKE_ENV"
          uv pip install --python "$SMOKE_ENV/bin/python" dist/*.whl
          "$SMOKE_ENV/bin/quick-template" --language typescript --no-add-api --output-dir "$RUNNER_TEMP/generated-project"
          test -f "$RUNNER_TEMP/generated-project/package.json"
          test -f "$RUNNER_TEMP/generated-project/AGENTS.md"

  test-template:
    needs: package-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            with-api: true
          - language: python
            with-api: false
          - language: golang
            with-api: true
          - language: golang
            with-api: false
          - language: typescript
            with-api: true
          - language: typescript
            with-api: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: 设置 Go
        if: matrix.language == 'golang'
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - name: 设置 Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 使用 scaffold 引擎生成项目
        id: generate
        run: |
          OUTPUT=$(uv run test_template.py "${{ matrix.language }}" "${{ matrix.with-api }}")
          echo "$OUTPUT"
          DST_DIR=$(echo "$OUTPUT" | grep "^OK:" | cut -d: -f2-)
          echo "dst_dir=$DST_DIR" >> "$GITHUB_OUTPUT"

      - name: 验证生成的项目结构
        run: |
          echo "=== 项目结构 ==="
          find "${{ steps.generate.outputs.dst_dir }}" -type f | head -30
          echo ""
          echo "=== 验证关键文件 ==="

      - name: 验证 Python 关键文件
        if: matrix.language == 'python'
        run: |
          D="${{ steps.generate.outputs.dst_dir }}"
          test -f "$D/pyproject.toml"
          test -d "$D/src"
          test -d "$D/tests"

      - name: 验证 Go 关键文件
        if: matrix.language == 'golang'
        run: |
          D="${{ steps.generate.outputs.dst_dir }}"
          test -f "$D/go.mod"
          test -d "$D/cmd"
          test -d "$D/internal"

      - name: 验证 TypeScript 关键文件
        if: matrix.language == 'typescript'
        run: |
          D="${{ steps.generate.outputs.dst_dir }}"
          test -f "$D/package.json"
          test -f "$D/tsconfig.json"
          test -d "$D/src"

      - name: 验证公共文件
        run: |
          D="${{ steps.generate.outputs.dst_dir }}"
          test -f "$D/Makefile"
          test -f "$D/README.md"

      # ========== Python 完整检查 ==========
      - name: Python — 安装依赖
        if: matrix.language == 'python'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          uv sync --all-groups

      - name: Python — ruff 检查
        if: matrix.language == 'python'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Python — mypy 类型检查
        if: matrix.language == 'python'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          PKG=$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -1)
          uv run mypy "src/$PKG"

      - name: Python — 运行测试
        if: matrix.language == 'python'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          PKG=$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -1)
          uv run pytest --cov="src/$PKG" --cov-report=term-missing -v

      # ========== Go 完整检查 ==========
      - name: Go — 验证模块
        if: matrix.language == 'golang'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          go mod download
          go mod tidy
          go vet ./...
          go build ./...
          go test ./...

      # ========== TypeScript 完整检查 ==========
      - name: TypeScript — 安装依赖
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: npm install

      - name: TypeScript — Biome 检查
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: npx biome check .

      - name: TypeScript — 类型检查
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: npx tsc --noEmit

      - name: TypeScript — 运行测试
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: npx vitest run
