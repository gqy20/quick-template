name: 测试模板生成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # runner 自带 shellcheck；本地 pre-commit 关闭 shellcheck 以兼容未安装的机器
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  package-smoke:
    name: Wheel 安装冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: 构建并安装 wheel
        run: |
          uv build
          SMOKE_ENV="$RUNNER_TEMP/quick-template-smoke"
          uv venv "$SMOKE_ENV"
          uv pip install --python "$SMOKE_ENV/bin/python" dist/*.whl
          "$SMOKE_ENV/bin/quick-template" --language typescript --no-add-api --output-dir "$RUNNER_TEMP/generated-project"
          test -f "$RUNNER_TEMP/generated-project/package.json"
          test -f "$RUNNER_TEMP/generated-project/AGENTS.md"
          # 分发清单只用于生成，不得随 wheel 泄漏到输出
          test ! -f "$RUNNER_TEMP/generated-project/.template.yml"

      - name: 冒烟 — Python 项目含可选内容
        run: |
          SMOKE_ENV="$RUNNER_TEMP/quick-template-smoke"
          OUT="$RUNNER_TEMP/generated-python"
          "$SMOKE_ENV/bin/quick-template" --language python --with-frontend --output-dir "$OUT"
          PKG=$(find "$OUT/src" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -f "$PKG/__init__.py"
          test -f "$OUT/examples/langgraph_review.py"
          test -f "$OUT/examples/claude_agent_guard.py"
          test -f "$OUT/DESIGN.md"
          test -f "$OUT/docs/README.md"
          test ! -f "$OUT/.template.yml"

  test-template:
    needs: package-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            with-api: true
            with-frontend: false
          - language: python
            with-api: false
            with-frontend: false
          - language: python
            with-api: true
            with-frontend: true
          - language: golang
            with-api: true
            with-frontend: false
          - language: golang
            with-api: false
            with-frontend: false
          - language: golang
            with-api: true
            with-frontend: true
          - language: typescript
            with-api: true
            with-frontend: false
          - language: typescript
            with-api: false
            with-frontend: false
          - language: typescript
            with-api: true
            with-frontend: true
          # 最旧的受支持 Python 版本单独验证一次
          - language: python
            with-api: true
            with-frontend: false
            python-version: "3.11"

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: 设置 Go
        if: matrix.language == 'golang'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: 安装 golangci-lint
        if: matrix.language == 'golang'
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v2.15.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: 设置 Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 安装 pnpm
        if: matrix.language == 'typescript'
        uses: pnpm/action-setup@v6
        with:
          version: "10.34.9"

      - name: 使用 scaffold 引擎生成项目
        id: generate
        run: |
          OUTPUT=$(uv run test_template.py "${{ matrix.language }}" "${{ matrix.with-api }}" "${{ matrix.with-frontend }}" "${{ matrix['python-version'] || '3.13' }}")
          echo "$OUTPUT"
          DST_DIR=$(echo "$OUTPUT" | grep "^OK:" | cut -d: -f2-)
          echo "dst_dir=$DST_DIR" >> "$GITHUB_OUTPUT"

      - name: 验证生成的项目结构
        run: |
          echo "=== 项目结构 ==="
          find "${{ steps.generate.outputs.dst_dir }}" -type f | head -30
          echo ""
          echo "=== 验证关键文件 ==="

      - name: 验证 Python 关键文件
        if: matrix.language == 'python'
        run: |
          D="${{ steps.generate.outputs.dst_dir }}"
          test -f "$D/pyproject.toml"
          test -d "$D/src"
          test -d "$D/tests"

      - name: 验证 Go 关键文件
        if: matrix.language == 'golang'
        run: |
          D="${{ steps.generate.outputs.dst_dir }}"
          test -f "$D/go.mod"
          test -d "$D/cmd"
          test -d "$D/internal"

      - name: 验证 TypeScript 关键文件
        if: matrix.language == 'typescript'
        run: |
          D="${{ steps.generate.outputs.dst_dir }}"
          test -f "$D/package.json"
          test -f "$D/tsconfig.json"
          test -d "$D/src"

      - name: 验证公共文件
        run: |
          D="${{ steps.generate.outputs.dst_dir }}"
          test -f "$D/Makefile"
          test -f "$D/README.md"
          test -f "$D/docs/README.md"
          test -f "$D/.pre-commit-config.yaml"
          # 分发清单只用于生成，不得出现在输出里
          test ! -f "$D/.template.yml"
          # DESIGN.md 与 --with-frontend 一致
          if [ "${{ matrix.with-frontend }}" = "true" ]; then
            test -f "$D/DESIGN.md"
            grep -q "DESIGN.md" "$D/AGENTS.md"
          else
            test ! -f "$D/DESIGN.md"
            if grep -q "DESIGN.md" "$D/AGENTS.md"; then
              echo "AGENTS.md 不应引用 DESIGN.md"
              exit 1
            fi
          fi
          # 不留模板控制标记
          if grep -rq "{{#endif}}" "$D"; then
            echo "生成结果残留模板控制标记"
            exit 1
          fi

      # ========== Python 完整检查 ==========
      - name: Python — 安装依赖
        if: matrix.language == 'python'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          uv sync --all-groups --all-extras

      - name: Python — ruff 检查
        if: matrix.language == 'python'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Python — mypy 类型检查
        if: matrix.language == 'python'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          PKG=$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -1)
          uv run mypy "src/$PKG"

      - name: Python — 运行测试
        if: matrix.language == 'python'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          PKG=$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -1)
          uv run pytest --cov="src/$PKG" --cov-report=term-missing -v

      # ========== Go 完整检查 ==========
      - name: Go — 验证模块
        if: matrix.language == 'golang'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          go mod download
          go mod tidy
          go vet ./...
          go build ./...
          go test ./...

      # ========== TypeScript 完整检查 ==========
      - name: TypeScript — 安装依赖
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: pnpm install

      - name: TypeScript — Biome 检查
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: pnpm exec biome check .

      - name: TypeScript — 类型检查
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: pnpm exec tsc --noEmit

      - name: TypeScript — 运行测试
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: pnpm exec vitest run

      - name: TypeScript — 构建
        if: matrix.language == 'typescript'
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          pnpm run build
          test -f dist/index.js
          test -f dist/index.d.ts

      # Makefile 是生成项目文档里的主入口，至少在每个语言的一个变体上验证它
      - name: 验证 Makefile 入口
        if: matrix['with-api'] == true && matrix['with-frontend'] == false
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: make all

      # ========== 生成的提交门禁必须能加载并执行 ==========
      - name: 提交门禁 — 初始化仓库并安装 hook
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          git init -q .
          git add -A
          uvx pre-commit install --hook-type pre-commit --hook-type commit-msg

      - name: 提交门禁 — 全量运行
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: 提交门禁 — commit-msg 拦截并放行
        working-directory: ${{ steps.generate.outputs.dst_dir }}
        run: |
          if git -c user.name=ci -c user.email=ci@example.com \
               commit -m "不符合约定的提交信息"; then
            echo "预期拦截，但提交成功"
            exit 1
          fi
          git -c user.name=ci -c user.email=ci@example.com \
            commit -m "chore: 验证提交门禁"
