[project]
name = "quick-template"
version = "0.3.0"
description = "Multi-language project scaffolding tool (Python / Go / TypeScript)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agent-example = [
    "claude-agent-sdk>=0.1.71",
    "opentelemetry-sdk>=1.41",
    "rich>=13.0",
]

[project.scripts]
quick-template = "scaffold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaffold"]

[tool.hatch.build.targets.wheel.force-include]
"languages" = "scaffold/templates/languages"
"shared" = "scaffold/templates/shared"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0,<9",
    "pytest-bdd>=8.0",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
